<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoBudget — Запрошення</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope','sans-serif'] }, colors: {
    surface:'#0B0B0C', panel:'#131315', card:'#1D1D21', card2:'#26262B', line:'rgba(255,255,255,0.07)',
    mint:'#34D399', coral:'#FF6B6B', amber:'#FFB454', orange:'#FF9F43', blue:'#4DA6FF', violet:'#A78BFA', pink:'#FF6B9D',
  } } } }
</script>
<style>body{font-family:'Manrope',sans-serif;}</style>
</head>
<body class="bg-surface text-[#F5F5F3] m-0">
  <div class="min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-sm bg-card rounded-3xl p-8 text-center">
      <div class="text-2xl font-extrabold mb-2">Co<span class="text-mint">Budget</span></div>
      <div id="content" class="mt-6">
        <div class="text-sm text-[#8C8C94] font-semibold">Перевіряємо запрошення…</div>
      </div>
    </div>
  </div>

<script src="/static/js/api_client.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const contentEl = document.getElementById("content");

  function renderError(message) {
    contentEl.innerHTML = `
      <div class="text-sm text-coral font-semibold mb-5">${message}</div>
      <a href="/budgets.html" class="block w-full bg-card2 font-bold rounded-full py-3 text-sm">До моїх бюджетів</a>
    `;
  }

  function renderAuthChoice(budgetName) {
    const nextUrl = encodeURIComponent(window.location.pathname + window.location.search);
    contentEl.innerHTML = `
      <div class="text-sm font-semibold mb-1">Вас запрошено до бюджету</div>
      <div class="text-lg font-extrabold mb-6">${budgetName}</div>
      <a href="/login.html?next=${nextUrl}" class="block w-full bg-mint text-surface font-extrabold rounded-full py-3 text-sm mb-3">Увійти</a>
      <a href="/register.html?next=${nextUrl}" class="block w-full bg-card2 font-bold rounded-full py-3 text-sm">Зареєструватися</a>
    `;
  }

  function renderJoining(budgetName) {
    contentEl.innerHTML = `
      <div class="text-sm font-semibold mb-1">Приєднуємось до бюджету</div>
      <div class="text-lg font-extrabold">${budgetName}</div>
      <div class="text-xs text-[#8C8C94] font-semibold mt-4">Зачекайте секунду…</div>
    `;
  }

  async function run() {
    if (!token) {
      renderError("Посилання-запрошення недійсне");
      return;
    }

    let preview;
    try {
      preview = await apiFetch(`/invites/${token}`);
    } catch (error) {
      renderError(error.message || "Посилання-запрошення недійсне або протерміноване");
      return;
    }

    if (!isAuthenticated()) {
      renderAuthChoice(preview.budget_name);
      return;
    }

    renderJoining(preview.budget_name);
    try {
      const result = await apiFetch(`/invites/${token}/accept`, { method: "POST" });
      window.location.href = `/dashboard.html?id=${result.budget_id}`;
    } catch (error) {
      if (error.code === "ALREADY_MEMBER") {
        window.location.href = `/dashboard.html?id=${preview.budget_id}`;
      } else {
        renderError(error.message || "Не вдалося приєднатися до бюджету");
      }
    }
  }

  run();
</script>
</body>
</html>
