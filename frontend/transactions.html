<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoBudget — Транзакції</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope','sans-serif'] }, colors: {
    surface:'#0B0B0C', panel:'#131315', card:'#1D1D21', card2:'#26262B', line:'rgba(255,255,255,0.07)',
    mint:'#34D399', coral:'#FF6B6B', amber:'#FFB454', orange:'#FF9F43', blue:'#4DA6FF', violet:'#A78BFA', pink:'#FF6B9D',
  } } } }
</script>
<style>body{font-family:'Manrope',sans-serif;}</style>
</head>
<body class="bg-surface text-[#F5F5F3] m-0">
  <div class="lg:flex lg:min-h-screen">

    <aside class="hidden lg:flex lg:w-64 lg:shrink-0 lg:flex-col bg-panel border-r border-line p-6">
      <div class="text-xl font-extrabold mb-8">Co<span class="text-mint">Budget</span></div>
      <div class="bg-card rounded-2xl px-4 py-3 mb-6">
        <div class="text-[10px] text-[#8C8C94] font-bold mb-1">ПОТОЧНИЙ БЮДЖЕТ</div>
        <div class="text-sm font-bold flex items-center justify-between">Сімейний бюджет <span class="text-[#8C8C94]">▾</span></div>
      </div>
      <nav class="flex flex-col gap-1 text-sm font-bold">
        <a id="sidebar-budget" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-full text-[#8C8C94] hover:bg-card"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Бюджет</a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-full bg-mint text-surface"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Транзакції</a>
        <a id="sidebar-categories" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-full text-[#8C8C94] hover:bg-card"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 12.5L12.5 20.6a2 2 0 01-2.8 0L3 13.9V3h10.9l6.7 6.7a2 2 0 010 2.8z"/><circle cx="8" cy="8" r="1.5"/></svg>Категорії</a>
        <a id="sidebar-members" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-full text-[#8C8C94] hover:bg-card"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-3 3-5 7-5s7 2 7 5"/></svg>Учасники</a>
      </nav>
      <div class="mt-auto flex items-center gap-3 pt-6 border-t border-line">
        <div class="w-9 h-9 rounded-full bg-mint flex items-center justify-center text-surface font-extrabold text-sm">В</div>
        <div class="text-sm font-bold">Ви</div>
      </div>
    </aside>

    <div class="lg:flex-1 min-h-screen relative flex flex-col">

      <header class="flex items-center gap-3 px-5 pt-6 pb-4 lg:px-10 lg:pt-8 lg:pb-6">
        <a id="back-link" href="#" class="w-8 h-8 flex items-center justify-center -ml-2 lg:hidden">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1 class="text-lg font-extrabold flex-1 lg:text-2xl">Транзакції</h1>
        <a id="add-transaction-link" href="#" class="hidden lg:inline-flex items-center gap-2 bg-mint text-surface font-extrabold rounded-full px-5 py-2.5 text-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Додати транзакцію
        </a>
        <div class="w-9 h-9 rounded-full bg-mint flex items-center justify-center text-surface font-extrabold text-sm">В</div>
      </header>

      <main class="flex-1 overflow-y-auto px-5 pb-32 lg:px-10 lg:pb-10">
        <div class="flex flex-col lg:flex-row gap-3 mb-5">
          <div class="flex items-center gap-2 bg-card rounded-2xl px-4 py-3 lg:flex-1 lg:max-w-sm">
            <svg class="w-4 h-4 text-[#8C8C94] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input id="search-input" placeholder="Пошук за коментарем" class="bg-transparent outline-none text-sm font-semibold w-full">
          </div>
          <div class="hidden lg:flex gap-3">
            <select id="category-filter" class="bg-card rounded-2xl px-4 text-sm font-semibold border-none outline-none">
              <option value="">Усі категорії</option>
            </select>
            <select id="author-filter" class="bg-card rounded-2xl px-4 text-sm font-semibold border-none outline-none">
              <option value="">Усі учасники</option>
            </select>
          </div>
        </div>

        <div id="transactions-list"></div>
      </main>

      <a id="fab-add-transaction" href="#" class="lg:hidden absolute right-5 bottom-24 w-14 h-14 rounded-full bg-mint flex items-center justify-center shadow-lg shadow-mint/30">
        <svg class="w-6 h-6 text-surface" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </a>
      <nav class="lg:hidden absolute bottom-0 left-0 right-0 bg-panel border-t border-line flex py-2">
        <a id="nav-budget" href="#" class="flex-1 flex flex-col items-center gap-1 text-[10.5px] font-bold text-[#8C8C94]">
          <div class="w-10 h-7 rounded-xl flex items-center justify-center"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
          Бюджет
        </a>
        <a href="#" class="flex-1 flex flex-col items-center gap-1 text-[10.5px] font-bold">
          <div class="w-10 h-7 rounded-xl bg-mint flex items-center justify-center"><svg class="w-4 h-4 text-surface" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>
          Транзакції
        </a>
        <a id="nav-categories" href="#" class="flex-1 flex flex-col items-center gap-1 text-[10.5px] font-bold text-[#8C8C94]">
          <div class="w-10 h-7 rounded-xl flex items-center justify-center"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 12.5L12.5 20.6a2 2 0 01-2.8 0L3 13.9V3h10.9l6.7 6.7a2 2 0 010 2.8z"/><circle cx="8" cy="8" r="1.5"/></svg></div>
          Категорії
        </a>
        <a id="nav-members" href="#" class="flex-1 flex flex-col items-center gap-1 text-[10.5px] font-bold text-[#8C8C94]">
          <div class="w-10 h-7 rounded-xl flex items-center justify-center"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-3 3-5 7-5s7 2 7 5"/></svg></div>
          Учасники
        </a>
      </nav>
    </div>
  </div>

<script src="/static/js/api_client.js"></script>
<script>
  if (!isAuthenticated()) window.location.href = "/login.html";

  const params = new URLSearchParams(window.location.search);
  const budgetId = params.get("id");
  if (!budgetId) window.location.href = "/budgets.html";

  document.getElementById("back-link").href = `dashboard.html?id=${budgetId}`;
  document.getElementById("sidebar-budget").href = `dashboard.html?id=${budgetId}`;
  document.getElementById("nav-budget").href = `dashboard.html?id=${budgetId}`;
  document.getElementById("sidebar-categories").href = `categories.html?id=${budgetId}`;
  document.getElementById("nav-categories").href = `categories.html?id=${budgetId}`;
  document.getElementById("sidebar-members").href = `members.html?id=${budgetId}`;
  document.getElementById("nav-members").href = `members.html?id=${budgetId}`;
  document.getElementById("add-transaction-link").href = `add-transaction.html?id=${budgetId}`;
  document.getElementById("fab-add-transaction").href = `add-transaction.html?id=${budgetId}`;

  const CATEGORY_COLORS = ["orange", "blue", "violet", "pink", "mint", "amber"];
  function colorForCategory(categoryId) {
    let hash = 0;
    for (const ch of categoryId) hash = (hash * 31 + ch.charCodeAt(0)) % CATEGORY_COLORS.length;
    return CATEGORY_COLORS[hash];
  }

  function formatMoney(value) {
    return Number(value).toLocaleString("uk-UA", { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + " ₴";
  }

  function formatDateLabel(dateStr) {
    const date = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    if (sameDay(date, today)) return "Сьогодні";
    if (sameDay(date, yesterday)) return "Вчора";
    return date.toLocaleDateString("uk-UA", { day: "numeric", month: "long" });
  }

  let categoriesById = {};
  let membersById = {};

  async function loadFilters() {
    const [categories, members] = await Promise.all([
      apiFetch(`/budgets/${budgetId}/categories`),
      apiFetch(`/budgets/${budgetId}/members`),
    ]);
    categoriesById = Object.fromEntries(categories.map((c) => [c.id, c]));
    membersById = Object.fromEntries(members.map((m) => [m.user_id, m]));

    const categorySelect = document.getElementById("category-filter");
    categories.forEach((c) => {
      const option = document.createElement("option");
      option.value = c.id;
      option.textContent = c.name;
      categorySelect.appendChild(option);
    });

    const authorSelect = document.getElementById("author-filter");
    members.forEach((m) => {
      const option = document.createElement("option");
      option.value = m.user_id;
      option.textContent = m.email;
      authorSelect.appendChild(option);
    });
  }

  function transactionRow(transaction) {
    const category = categoriesById[transaction.category_id];
    const author = membersById[transaction.user_id];
    const color = category ? colorForCategory(category.id) : "card2";
    const isIncome = transaction.type === "income";
    const title = transaction.comment || (category ? category.name : "Транзакція");
    return `
      <div class="flex items-center gap-3 py-3 lg:py-4 border-b border-line last:border-b-0">
        <div class="w-8 h-8 rounded-lg bg-${color} flex items-center justify-center shrink-0"></div>
        <div class="flex-1 min-w-0"><div class="text-sm font-bold truncate">${title}</div><div class="text-xs text-[#8C8C94] font-semibold">${category ? category.name : ""} · ${author ? author.email : ""}</div></div>
        <div class="text-sm font-extrabold ${isIncome ? "text-mint" : ""}">${isIncome ? "+" : "–"}${formatMoney(transaction.amount)}</div>
      </div>
    `;
  }

  let searchDebounce = null;
  function scheduleReload() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(loadTransactions, 300);
  }

  async function loadTransactions() {
    const query = new URLSearchParams({ page_size: "50" });
    const search = document.getElementById("search-input").value.trim();
    const categoryId = document.getElementById("category-filter").value;
    const authorId = document.getElementById("author-filter").value;
    if (search) query.set("search", search);
    if (categoryId) query.set("category_id", categoryId);
    if (authorId) query.set("author_id", authorId);

    try {
      const page = await apiFetch(`/budgets/${budgetId}/transactions?${query.toString()}`);
      const listEl = document.getElementById("transactions-list");

      if (page.items.length === 0) {
        listEl.innerHTML = `<div class="text-sm text-[#8C8C94] font-semibold text-center py-16">Транзакцій не знайдено</div>`;
        return;
      }

      let currentGroup = null;
      let html = "";
      page.items.forEach((transaction) => {
        const label = formatDateLabel(transaction.txn_date);
        if (label !== currentGroup) {
          if (currentGroup !== null) html += `</div>`;
          html += `<div class="text-xs font-bold text-[#8C8C94] mb-2 mt-4">${label}</div><div class="bg-card rounded-2xl px-4 lg:px-5 mb-5">`;
          currentGroup = label;
        }
        html += transactionRow(transaction);
      });
      html += `</div>`;
      listEl.innerHTML = html;
    } catch (error) {
      showToast(error.message || "Не вдалося завантажити транзакції", "error");
    }
  }

  document.getElementById("search-input").addEventListener("input", scheduleReload);
  document.getElementById("category-filter").addEventListener("change", loadTransactions);
  document.getElementById("author-filter").addEventListener("change", loadTransactions);

  loadFilters().then(loadTransactions);
</script>
</body>
</html>
