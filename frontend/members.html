<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoBudget — Учасники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope','sans-serif'] }, colors: {
    surface:'#0B0B0C', panel:'#131315', card:'#1D1D21', card2:'#26262B', line:'rgba(255,255,255,0.07)',
    mint:'#34D399', coral:'#FF6B6B', amber:'#FFB454', orange:'#FF9F43', blue:'#4DA6FF', violet:'#A78BFA', pink:'#FF6B9D',
  } } } }
</script>
<style>body{font-family:'Manrope',sans-serif;}</style>
</head>
<body class="bg-surface text-[#F5F5F3] m-0">
  <div class="lg:flex lg:min-h-screen">

    <aside class="hidden lg:flex lg:w-64 lg:shrink-0 lg:flex-col bg-panel border-r border-line p-6">
      <div class="text-xl font-extrabold mb-8">Co<span class="text-mint">Budget</span></div>
      <div class="bg-card rounded-2xl px-4 py-3 mb-6">
        <div class="text-[10px] text-[#8C8C94] font-bold mb-1">ПОТОЧНИЙ БЮДЖЕТ</div>
        <div class="text-sm font-bold flex items-center justify-between">Сімейний бюджет <span class="text-[#8C8C94]">▾</span></div>
      </div>
      <nav class="flex flex-col gap-1 text-sm font-bold">
        <a id="sidebar-budget" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-full text-[#8C8C94] hover:bg-card"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Бюджет</a>
        <a id="sidebar-transactions" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-full text-[#8C8C94] hover:bg-card"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Транзакції</a>
        <a id="sidebar-categories" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-full text-[#8C8C94] hover:bg-card"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 12.5L12.5 20.6a2 2 0 01-2.8 0L3 13.9V3h10.9l6.7 6.7a2 2 0 010 2.8z"/><circle cx="8" cy="8" r="1.5"/></svg>Категорії</a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-full bg-mint text-surface"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-3 3-5 7-5s7 2 7 5"/></svg>Учасники</a>
      </nav>
      <div class="mt-auto flex items-center gap-3 pt-6 border-t border-line">
        <div class="w-9 h-9 rounded-full bg-mint flex items-center justify-center text-surface font-extrabold text-sm">В</div>
        <div class="text-sm font-bold">Ви</div>
      </div>
    </aside>

    <div class="lg:flex-1 min-h-screen relative flex flex-col">

      <header class="flex items-center gap-3 px-5 pt-6 pb-4 lg:px-10 lg:pt-8 lg:pb-6">
        <a id="back-link" href="#" class="w-8 h-8 flex items-center justify-center -ml-2 lg:hidden">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1 class="text-lg font-extrabold flex-1 lg:text-2xl">Учасники</h1>
        <div class="w-9 h-9 rounded-full bg-mint flex items-center justify-center text-surface font-extrabold text-sm">В</div>
      </header>

      <main class="flex-1 overflow-y-auto px-5 pb-28 lg:px-10 lg:pb-10">

        <div id="invite-box" class="hidden bg-card rounded-2xl lg:rounded-3xl p-4 lg:p-6 mb-5 lg:flex lg:items-center lg:justify-between">
          <div>
            <p class="text-xs lg:text-sm text-[#8C8C94] font-semibold mb-3 lg:mb-1">Надішліть посилання, щоб додати нового учасника до бюджету.</p>
            <p class="hidden lg:block text-xs text-[#8C8C94] font-semibold">Посилання діє 7 днів</p>
          </div>
          <button id="invite-btn" class="w-full lg:w-auto bg-card2 font-bold rounded-full py-3 lg:py-2.5 px-5 text-sm shrink-0">Скопіювати посилання-запрошення</button>
        </div>

        <div id="members-list" class="bg-card rounded-2xl lg:rounded-3xl px-4 lg:px-6"></div>
      </main>

      <nav class="lg:hidden absolute bottom-0 left-0 right-0 bg-panel border-t border-line flex py-2">
        <a id="nav-budget" href="#" class="flex-1 flex flex-col items-center gap-1 text-[10.5px] font-bold text-[#8C8C94]">
          <div class="w-10 h-7 rounded-xl flex items-center justify-center"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
          Бюджет
        </a>
        <a id="nav-transactions" href="#" class="flex-1 flex flex-col items-center gap-1 text-[10.5px] font-bold text-[#8C8C94]">
          <div class="w-10 h-7 rounded-xl flex items-center justify-center"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>
          Транзакції
        </a>
        <a id="nav-categories" href="#" class="flex-1 flex flex-col items-center gap-1 text-[10.5px] font-bold text-[#8C8C94]">
          <div class="w-10 h-7 rounded-xl flex items-center justify-center"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 12.5L12.5 20.6a2 2 0 01-2.8 0L3 13.9V3h10.9l6.7 6.7a2 2 0 010 2.8z"/><circle cx="8" cy="8" r="1.5"/></svg></div>
          Категорії
        </a>
        <a href="#" class="flex-1 flex flex-col items-center gap-1 text-[10.5px] font-bold">
          <div class="w-10 h-7 rounded-xl bg-mint flex items-center justify-center"><svg class="w-4 h-4 text-surface" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-3 3-5 7-5s7 2 7 5"/></svg></div>
          Учасники
        </a>
      </nav>
    </div>
  </div>

<script src="/static/js/api_client.js"></script>
<script>
  if (!isAuthenticated()) window.location.href = "/login.html";

  const params = new URLSearchParams(window.location.search);
  const budgetId = params.get("id");
  if (!budgetId) window.location.href = "/budgets.html";

  document.getElementById("back-link").href = `dashboard.html?id=${budgetId}`;
  document.getElementById("sidebar-budget").href = `dashboard.html?id=${budgetId}`;
  document.getElementById("nav-budget").href = `dashboard.html?id=${budgetId}`;
  document.getElementById("sidebar-transactions").href = `transactions.html?id=${budgetId}`;
  document.getElementById("nav-transactions").href = `transactions.html?id=${budgetId}`;
  document.getElementById("sidebar-categories").href = `categories.html?id=${budgetId}`;
  document.getElementById("nav-categories").href = `categories.html?id=${budgetId}`;

  // A JWT's payload is not encrypted, only signed — reading it client-side
  // just to know "which row is me" is safe; the server still enforces every
  // real permission check independently of anything decoded here.
  function decodeJwtPayload(token) {
    try {
      return JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    } catch (error) {
      return null;
    }
  }
  const myUserId = decodeJwtPayload(getToken())?.sub;

  const AVATAR_COLORS = ["mint", "orange", "blue", "violet", "pink", "amber"];
  let isOwner = false;

  function memberRow(member, index) {
    const isMe = member.user_id === myUserId;
    const label = isMe ? "Ви" : member.email;
    const roleLabel = member.role === "owner" ? "Власник" : "Учасник";
    const roleBadgeClass = member.role === "owner" ? "text-mint bg-mint/10" : "text-[#8C8C94] bg-card2";

    let actions = "";
    if (isOwner && !isMe) {
      const toggleLabel = member.role === "owner" ? "Зробити учасником" : "Зробити власником";
      const toggleRole = member.role === "owner" ? "member" : "owner";
      actions = `
        <button data-action="role" data-id="${member.user_id}" data-role="${toggleRole}" class="text-xs font-bold text-[#8C8C94] mr-3">${toggleLabel}</button>
        <button data-action="remove" data-id="${member.user_id}" class="text-xs font-bold text-coral">Видалити</button>
      `;
    }

    return `
      <div class="flex items-center gap-3 py-3.5 lg:py-4 border-b border-line last:border-b-0">
        <div class="w-10 h-10 rounded-full bg-${AVATAR_COLORS[index % AVATAR_COLORS.length]} flex items-center justify-center text-surface font-extrabold text-sm shrink-0">${member.email[0].toUpperCase()}</div>
        <div class="flex-1">
          <div class="text-sm font-bold">${label}</div>
          <div class="text-xs text-[#8C8C94] font-semibold">${member.email}</div>
        </div>
        <span class="text-[11px] font-bold ${roleBadgeClass} px-3 py-1.5 rounded-full mr-3">${roleLabel}</span>
        ${actions}
      </div>
    `;
  }

  async function loadMembers() {
    try {
      const [budget, members] = await Promise.all([
        apiFetch(`/budgets/${budgetId}`),
        apiFetch(`/budgets/${budgetId}/members`),
      ]);
      isOwner = budget.role === "owner";
      document.getElementById("invite-box").classList.toggle("hidden", !isOwner);

      const listEl = document.getElementById("members-list");
      listEl.innerHTML = members.map(memberRow).join("");

      listEl.querySelectorAll('[data-action="remove"]').forEach((btn) => {
        btn.addEventListener("click", () => removeMember(btn.dataset.id));
      });
      listEl.querySelectorAll('[data-action="role"]').forEach((btn) => {
        btn.addEventListener("click", () => changeRole(btn.dataset.id, btn.dataset.role));
      });
    } catch (error) {
      showToast(error.message || "Не вдалося завантажити учасників", "error");
    }
  }

  async function removeMember(userId) {
    if (!confirm("Видалити цього учасника з бюджету?")) return;
    try {
      await apiFetch(`/budgets/${budgetId}/members/${userId}`, { method: "DELETE" });
      showToast("Учасника видалено");
      await loadMembers();
    } catch (error) {
      showToast(error.message || "Не вдалося видалити учасника", "error");
    }
  }

  async function changeRole(userId, role) {
    try {
      await apiFetch(`/budgets/${budgetId}/members/${userId}`, {
        method: "PATCH",
        body: JSON.stringify({ role }),
      });
      showToast("Роль оновлено");
      await loadMembers();
    } catch (error) {
      showToast(error.message || "Не вдалося змінити роль", "error");
    }
  }

  document.getElementById("invite-btn").addEventListener("click", async () => {
    try {
      const invite = await apiFetch(`/budgets/${budgetId}/invites`, { method: "POST" });
      const link = `${window.location.origin}/invite.html?token=${invite.token}`;
      await navigator.clipboard.writeText(link);
      showToast("Посилання скопійовано");
    } catch (error) {
      showToast(error.message || "Не вдалося створити запрошення", "error");
    }
  });

  loadMembers();
</script>
</body>
</html>
